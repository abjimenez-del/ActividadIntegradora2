<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskManager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>TaskManager</h1>
    <div id="notificacion" class="notificacion oculto" role="alert"></div>

    <section id="dashboard" class="dashboard" aria-label="Métricas">
      <div class="card"><span id="m-total">0</span><small>Total</small></div>
      <div class="card"><span id="m-pend">0</span><small>Pendientes</small></div>
      <div class="card"><span id="m-comp">0</span><small>Completadas</small></div>
    </section>

    <form id="form-tarea" novalidate>
      <input type="hidden" id="tarea-id">
      <input type="text" id="titulo" placeholder="Título de la tarea" maxlength="100">
      <select id="prioridad">
        <option value="2">Media</option>
        <option value="3">Alta</option>
        <option value="1">Baja</option>
      </select>
      <button type="submit" id="btn-guardar">Agregar</button>
      <button type="button" id="btn-cancelar" class="oculto">Cancelar</button>
    </form>
    <p id="error-form" class="error"></p>

    <section class="controles">
      <input type="search" id="buscar" placeholder="Buscar por título...">
      <select id="filtro">
        <option value="todas">Todas</option>
        <option value="pendientes">Pendientes</option>
        <option value="completadas">Completadas</option>
      </select>
      <select id="orden">
        <option value="fecha-desc">Más recientes</option>
        <option value="fecha-asc">Más antiguas</option>
        <option value="prioridad-desc">Prioridad (Alta → Baja)</option>
        <option value="prioridad-asc">Prioridad (Baja → Alta)</option>
      </select>
    </section>

    <p id="cargando" class="vacio oculto">Cargando tareas...</p>
    <ul id="lista" class="lista"></ul>
  </main>
  <script src="app.js"></script>
</body>
</html>
